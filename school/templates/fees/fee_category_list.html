{% extends "base.html" %}

{% block title %}Fee Categories{% endblock %}

{% block content %}

<div class="d-flex justify-content-between mb-3">

    <h3>Fee Categories</h3>

    <a href="{% url 'add_fee_category' %}" class="btn btn-primary">
        Add Fee Category
    </a>

</div>

<table class="table table-bordered">

    <thead class="table-primary">

        <tr>

            <th>Name</th>

            <th>Amount</th>

            <th>Action</th>

        </tr>

    </thead>

    <tbody>

    {% for fee in fee_categories %}

        <tr>

            <td>{{ fee.name }}</td>

            <td>₹ {{ fee.amount }}</td>

            <td>

                <a href="{% url 'edit_fee_category' fee.id %}"
                   class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a href="{% url 'delete_fee_category' fee.id %}"
                   class="btn btn-danger btn-sm">
                    Delete
                </a>

            </td>

        </tr>

    {% empty %}

        <tr>

            <td colspan="3" class="text-center">
                No Fee Categories Found
            </td>

        </tr>

    {% endfor %}

    </tbody>

</table>

{% endblock %}
