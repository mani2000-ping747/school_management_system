{% extends "base.html" %}

{% block title %}
Edit Assigned Fee
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h4 class="mb-0">
                Edit Assigned Fee
            </h4>

        </div>

        <div class="card-body">

            <div class="alert alert-info">

                <strong>Student:</strong>
                {{ student_fee.student }}

                <br>

                <strong>Current Fee:</strong>
                {{ student_fee.fee_category }}

            </div>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <div class="mt-3">

                    <button
                        type="submit"
                        class="btn btn-success">

                        Update Fee

                    </button>

                    <a
                        href="{% url 'assigned_fee_list' %}"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
