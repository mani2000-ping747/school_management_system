{% extends "base.html" %}

{% block title %}
Assign Fees
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-primary text-white">

        Assign Fee To Student

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-success">

                Assign Fee

            </button>

        </form>

    </div>

</div>

{% endblock %}
